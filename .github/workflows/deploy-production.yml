name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy for rollback. Leave empty to build this commit."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-north1
  SERVICE_NAME: milloin
  ARTIFACT_REPOSITORY: milloin

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Resolve immutable image
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
            build=false
          else
            tag="$GITHUB_SHA"
            build=true
          fi
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build tested revision
        if: steps.image.outputs.build == 'true'
        run: docker build --tag "${{ steps.image.outputs.image }}" .

      - name: Push image
        if: steps.image.outputs.build == 'true'
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Deploy image to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --quiet

      - name: Capture deployed revision
        id: service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          url=$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          revision=$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $revision"
          echo "Service URL: $url"

      - name: Production health smoke test
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent "${SERVICE_URL}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1
